<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Batch Management</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
    }

    /* HEADER */

    .header {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        padding: 25px 40px;

        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header h1 {
        margin: 0;
        font-size: 28px;
    }

    .header p {
        margin: 6px 0 0;
        opacity: 0.9;
    }

    .dashboard-btn {
        background: white;
        color: #1d4ed8;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }

    .dashboard-btn:hover {
        background: #e5e7eb;
    }

    /* MAIN */

    .container {
        width: 92%;
        max-width: 1200px;
        margin: 30px auto;
    }

    /* STATS */

    .stats {
        display: grid;
        grid-template-columns: 1fr;
        margin-bottom: 25px;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 12px;

        box-shadow:
            0 4px 15px rgba(0,0,0,0.08);
    }

    .card h3 {
        margin: 0;
        color: #6b7280;
        font-size: 15px;
    }

    .card h2 {
        margin: 10px 0 0;
        font-size: 28px;
        color: #2563eb;
    }

    /* FORM */

    .form-section {
        background: white;
        padding: 25px;
        border-radius: 12px;

        box-shadow:
            0 4px 15px rgba(0,0,0,0.08);

        margin-bottom: 25px;
    }

    .form-section h2 {
        margin-top: 0;
        margin-bottom: 20px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }

    input,
    select {
        width: 100%;
        padding: 12px;

        border: 1px solid #d1d5db;
        border-radius: 8px;

        font-size: 14px;
        background: white;
    }

    input:focus,
    select:focus {
        outline: none;
        border-color: #2563eb;
    }

    .buttons {
        margin-top: 18px;

        display: flex;
        gap: 10px;
    }

    button {
        border: none;
        border-radius: 8px;
        padding: 11px 18px;

        cursor: pointer;
        font-weight: bold;
    }

    .save-btn {
        background: #2563eb;
        color: white;
    }

    .save-btn:hover {
        background: #1d4ed8;
    }

    .update-btn {
        background: #16a34a;
        color: white;
    }

    .update-btn:hover {
        background: #15803d;
    }

    .clear-btn {
        background: #6b7280;
        color: white;
    }

    .clear-btn:hover {
        background: #4b5563;
    }

    /* TABLE */

    .table-section {
        background: white;
        padding: 25px;
        border-radius: 12px;

        box-shadow:
            0 4px 15px rgba(0,0,0,0.08);
    }

    .table-header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        margin-bottom: 15px;
    }

    .table-header h2 {
        margin: 0;
    }

    .refresh-btn {
        background: #2563eb;
        color: white;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        background: #eff6ff;
        color: #1e40af;

        padding: 13px;
        text-align: center;
    }

    td {
        padding: 12px;
        text-align: center;

        border-bottom:
            1px solid #e5e7eb;
    }

    tr:hover {
        background: #f9fafb;
    }

    /* BADGES */

    .course-badge {
        display: inline-block;

        padding: 5px 12px;

        border-radius: 20px;

        background: #dbeafe;
        color: #1d4ed8;

        font-weight: bold;
    }

    .timing-badge {
        display: inline-block;

        padding: 5px 12px;

        border-radius: 20px;

        background: #f3e8ff;
        color: #7e22ce;

        font-weight: bold;
    }

    /* ACTION BUTTONS */

    .edit {
        background: #f59e0b;
        color: white;

        margin-right: 5px;
    }

    .edit:hover {
        background: #d97706;
    }

    .delete {
        background: #dc2626;
        color: white;
    }

    .delete:hover {
        background: #b91c1c;
    }

    /* RESPONSIVE */

    @media (max-width: 768px) {

        .header {
            padding: 20px;

            flex-direction: column;

            gap: 15px;

            text-align: center;
        }

        .container {
            width: 95%;
        }

        .form-grid {
            grid-template-columns: 1fr;
        }

        .table-section {
            overflow-x: auto;
        }

        table {
            min-width: 700px;
        }

    }

</style>
```

<body>

```
<!-- HEADER -->

<div class="header">

    <div>

        <h1>Batch Management</h1>

        <p>
            Manage coaching batches, courses and timings
        </p>

    </div>


    <button
        class="dashboard-btn"
        onclick="window.location.href='dashboard.html'">

        Dashboard

    </button>

</div>



<div class="container">


    <!-- STATS -->

    <div class="stats">

        <div class="card">

            <h3>Total Batches</h3>

            <h2 id="batchCount">0</h2>

        </div>

    </div>



    <!-- FORM -->

    <div class="form-section">

        <h2>Add / Update Batch</h2>


        <div class="form-grid">


            <input
                type="number"
                id="id"
                placeholder="Batch ID">


            <input
                type="text"
                id="name"
                placeholder="Batch Name">


            <select id="course">

                <option value="">
                    Select Course
                </option>

            </select>


            <input
                type="text"
                id="timing"
                placeholder="Timing (Example: 10 AM - 12 PM)">

        </div>


        <div class="buttons">


            <button
                class="save-btn"
                onclick="saveBatch()">

                Save

            </button>


            <button
                class="update-btn"
                onclick="updateBatch()">

                Update

            </button>


            <button
                class="clear-btn"
                onclick="clearForm()">

                Clear

            </button>


        </div>

    </div>



    <!-- TABLE -->

    <div class="table-section">


        <div class="table-header">

            <h2>Batch List</h2>


            <button
                class="refresh-btn"
                onclick="loadBatches()">

                Refresh

            </button>

        </div>



        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Batch Name</th>

                    <th>Course</th>

                    <th>Timing</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="batchTable">

            </tbody>

        </table>


    </div>


</div>
```

<script>


const apiUrl = "/batches";
const courseApiUrl = "/courses";

let courses = [];


/* LOGIN PROTECTION */

if (sessionStorage.getItem("isLoggedIn") !== "true") {

    window.location.href = "index.html";

}


/* LOAD COURSES */

function loadCourses() {

    fetch(courseApiUrl)

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load courses"
                );

            }

            return response.json();

        })

        .then(data => {


            courses = data;


            const dropdown =
                document.getElementById("course");


            dropdown.innerHTML =
                '<option value="">Select Course</option>';


            data.forEach(course => {


                dropdown.innerHTML += `

                    <option value="${course.name}">

                        ${course.name}

                    </option>

                `;


            });

        })


        .catch(error => {

            console.log(error);

            alert(
                "Error loading courses"
            );

        });

}


/* LOAD BATCHES */

function loadBatches() {

    fetch(apiUrl)

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load batches"
                );

            }

            return response.json();

        })

        .then(data => {


            const table =
                document.getElementById(
                    "batchTable"
                );


            table.innerHTML = "";


            /* BATCH COUNT */

            document.getElementById(
                "batchCount"
            ).innerText = data.length;



            data.forEach(batch => {


                table.innerHTML += `

                    <tr>

                        <td>
                            ${batch.id}
                        </td>


                        <td>

                            <strong>
                                ${batch.name}
                            </strong>

                        </td>


                        <td>

                            <span class="course-badge">

                                ${batch.course}

                            </span>

                        </td>


                        <td>

                            <span class="timing-badge">

                                ${batch.timing}

                            </span>

                        </td>


                        <td>


                            <button

                                class="edit"

                                onclick="editBatch(

                                    ${batch.id},

                                    '${batch.name}',

                                    '${batch.course}',

                                    '${batch.timing}'

                                )">

                                Edit

                            </button>



                            <button

                                class="delete"

                                onclick="deleteBatch(

                                    ${batch.id}

                                )">

                                Delete

                            </button>


                        </td>


                    </tr>

                `;


            });


        })


        .catch(error => {

            console.log(error);

            alert(
                "Error loading batches"
            );

        });

}


/* VALIDATE BATCH */

function validateBatch() {


    const id =
        document.getElementById("id")
            .value.trim();


    const name =
        document.getElementById("name")
            .value.trim();


    const course =
        document.getElementById("course")
            .value;


    const timing =
        document.getElementById("timing")
            .value.trim();



    /* ID */

    if (!id) {

        alert(
            "Please enter Batch ID"
        );

        return false;

    }


    if (Number(id) <= 0) {

        alert(
            "Batch ID must be greater than 0"
        );

        return false;

    }



    /* BATCH NAME */

    if (!name) {

        alert(
            "Please enter Batch Name"
        );

        return false;

    }


    if (name.length < 2) {

        alert(
            "Batch Name must contain at least 2 characters"
        );

        return false;

    }



    /* COURSE */

    if (!course) {

        alert(
            "Please select a course"
        );

        return false;

    }



    /* TIMING */

    if (!timing) {

        alert(
            "Please enter Batch Timing"
        );

        return false;

    }


    if (timing.length < 2) {

        alert(
            "Batch Timing must contain at least 2 characters"
        );

        return false;

    }


    return true;

}


/* SAVE BATCH */

function saveBatch() {


    if (!validateBatch()) {

        return;

    }


    const batch = {


        id: Number(

            document.getElementById("id")
                .value

        ),


        name:

            document.getElementById("name")
                .value.trim(),


        course:

            document.getElementById("course")
                .value,


        timing:

            document.getElementById("timing")
                .value.trim()

    };



    fetch(apiUrl, {


        method: "POST",


        headers: {

            "Content-Type":
                "application/json"

        },


        body:
            JSON.stringify(batch)


    })


    .then(response => {


        if (!response.ok) {

            throw new Error(
                "Failed to add batch"
            );

        }


        return response.json();

    })


    .then(data => {


        alert(
            "Batch added successfully"
        );


        clearForm();


        loadBatches();

    })


    .catch(error => {


        console.log(error);


        alert(
            "Error adding batch"
        );

    });

}


/* EDIT BATCH */

function editBatch(
    id,
    name,
    course,
    timing
) {


    document.getElementById("id")
        .value = id;


    document.getElementById("name")
        .value = name;


    document.getElementById("course")
        .value = course;


    document.getElementById("timing")
        .value = timing;

}


/* UPDATE BATCH */

function updateBatch() {


    if (!validateBatch()) {

        return;

    }


    const batch = {


        id: Number(

            document.getElementById("id")
                .value

        ),


        name:

            document.getElementById("name")
                .value.trim(),


        course:

            document.getElementById("course")
                .value,


        timing:

            document.getElementById("timing")
                .value.trim()

    };



    fetch(apiUrl, {


        method: "PUT",


        headers: {

            "Content-Type":
                "application/json"

        },


        body:
            JSON.stringify(batch)


    })


    .then(response => {


        if (!response.ok) {

            throw new Error(
                "Failed to update batch"
            );

        }


        return response.json();

    })


    .then(data => {


        alert(
            "Batch updated successfully"
        );


        clearForm();


        loadBatches();

    })


    .catch(error => {


        console.log(error);


        alert(
            "Error updating batch"
        );

    });

}


/* DELETE BATCH */

function deleteBatch(id) {


    if (

        !confirm(
            "Are you sure you want to delete this batch?"
        )

    ) {

        return;

    }



    fetch(
        apiUrl + "/" + id,
        {
            method: "DELETE"
        }
    )


    .then(response => {


        if (!response.ok) {

            throw new Error(
                "Failed to delete batch"
            );

        }


        return response.text();

    })


    .then(data => {


        alert(data);


        loadBatches();

    })


    .catch(error => {


        console.log(error);


        alert(
            "Error deleting batch"
        );

    });

}


/* CLEAR FORM */

function clearForm() {


    document.getElementById("id")
        .value = "";


    document.getElementById("name")
        .value = "";


    document.getElementById("course")
        .value = "";


    document.getElementById("timing")
        .value = "";

}


/* LOAD DATA */

loadCourses();

loadBatches();


</script>

</body>

</html>
