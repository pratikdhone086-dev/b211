<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marks Management</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
    }

    /* HEADER */

    .header {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        padding: 25px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header h1 {
        margin: 0;
        font-size: 28px;
    }

    .header p {
        margin: 6px 0 0;
        opacity: 0.9;
    }

    .dashboard-btn {
        background: white;
        color: #1d4ed8;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }

    .dashboard-btn:hover {
        background: #e5e7eb;
    }

    /* MAIN */

    .container {
        width: 92%;
        max-width: 1200px;
        margin: 30px auto;
    }

    /* STATS */

    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 25px;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card h3 {
        margin: 0;
        color: #6b7280;
        font-size: 15px;
    }

    .card h2 {
        margin: 10px 0 0;
        font-size: 28px;
        color: #2563eb;
    }

    /* FORM */

    .form-section {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        margin-bottom: 25px;
    }

    .form-section h2 {
        margin-top: 0;
        margin-bottom: 20px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }

    input,
    select {
        width: 100%;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
    }

    input:focus,
    select:focus {
        outline: none;
        border-color: #2563eb;
    }

    .buttons {
        margin-top: 18px;
        display: flex;
        gap: 10px;
    }

    button {
        border: none;
        border-radius: 8px;
        padding: 11px 18px;
        cursor: pointer;
        font-weight: bold;
    }

    .save-btn {
        background: #2563eb;
        color: white;
    }

    .save-btn:hover {
        background: #1d4ed8;
    }

    .update-btn {
        background: #16a34a;
        color: white;
    }

    .update-btn:hover {
        background: #15803d;
    }

    .clear-btn {
        background: #6b7280;
        color: white;
    }

    .clear-btn:hover {
        background: #4b5563;
    }

    /* TABLE */

    .table-section {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .table-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }

    .table-header h2 {
        margin: 0;
    }

    .refresh-btn {
        background: #2563eb;
        color: white;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        background: #eff6ff;
        color: #1e40af;
        padding: 13px;
        text-align: center;
    }

    td {
        padding: 12px;
        text-align: center;
        border-bottom: 1px solid #e5e7eb;
    }

    tr:hover {
        background: #f9fafb;
    }

    /* MARKS BADGE */

    .marks-badge {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 20px;
        background: #dbeafe;
        color: #1d4ed8;
        font-weight: bold;
    }

    /* ACTION BUTTONS */

    .edit {
        background: #f59e0b;
        color: white;
        margin-right: 5px;
    }

    .edit:hover {
        background: #d97706;
    }

    .delete {
        background: #dc2626;
        color: white;
    }

    .delete:hover {
        background: #b91c1c;
    }

    /* RESPONSIVE */

    @media (max-width: 768px) {

        .header {
            padding: 20px;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        .container {
            width: 95%;
        }

        .stats {
            grid-template-columns: 1fr;
        }

        .form-grid {
            grid-template-columns: 1fr;
        }

        .table-section {
            overflow-x: auto;
        }

        table {
            min-width: 700px;
        }

    }

</style>

<body>

```
<!-- HEADER -->

<div class="header">

    <div>
        <h1>Marks Management</h1>
        <p>Manage student examination marks</p>
    </div>

    <button
        class="dashboard-btn"
        onclick="window.location.href='dashboard.html'">

        Dashboard

    </button>

</div>


<div class="container">


    <!-- STATS -->

    <div class="stats">

        <div class="card">

            <h3>Total Marks Records</h3>

            <h2 id="totalMarks">0</h2>

        </div>


        <div class="card">

            <h3>Average Marks</h3>

            <h2 id="averageMarks">0</h2>

        </div>


        <div class="card">

            <h3>Highest Marks</h3>

            <h2 id="highestMarks">0</h2>

        </div>

    </div>


    <!-- FORM -->

    <div class="form-section">

        <h2>Add / Update Marks</h2>

        <div class="form-grid">

            <input
                type="number"
                id="id"
                placeholder="Marks ID">


            <select id="studentId">

                <option value="">
                    Select Student
                </option>

            </select>


            <input
                type="text"
                id="subject"
                placeholder="Subject">


            <input
                type="number"
                id="marks"
                placeholder="Marks (0 - 100)"
                min="0"
                max="100">

        </div>


        <div class="buttons">

            <button
                class="save-btn"
                onclick="saveMarks()">

                Save

            </button>


            <button
                class="update-btn"
                onclick="updateMarks()">

                Update

            </button>


            <button
                class="clear-btn"
                onclick="clearForm()">

                Clear

            </button>

        </div>

    </div>


    <!-- TABLE -->

    <div class="table-section">

        <div class="table-header">

            <h2>Marks List</h2>

            <button
                class="refresh-btn"
                onclick="loadMarks()">

                Refresh

            </button>

        </div>


        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Student</th>
                    <th>Subject</th>
                    <th>Marks</th>
                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="marksTable">

            </tbody>

        </table>

    </div>

</div>
```

<script>

const apiUrl = "/marks";
const studentApiUrl = "/students";

let students = [];


/* LOGIN PROTECTION */

if (sessionStorage.getItem("isLoggedIn") !== "true") {

    window.location.href = "index.html";

}


/* LOAD STUDENTS */

function loadStudents() {

    fetch(studentApiUrl)

        .then(response => response.json())

        .then(data => {

            students = data;

            const dropdown =
                document.getElementById("studentId");

            dropdown.innerHTML =
                '<option value="">Select Student</option>';

            data.forEach(student => {

                dropdown.innerHTML += `
                    <option value="${student.id}">
                        ${student.id} - ${student.name}
                    </option>
                `;

            });

        })

        .catch(error => {

            console.log(error);

            alert("Error loading students");

        });

}


/* LOAD MARKS */

function loadMarks() {

    fetch(apiUrl)

        .then(response => response.json())

        .then(data => {

            const table =
                document.getElementById("marksTable");

            table.innerHTML = "";

            let total = 0;
            let highest = 0;

            data.forEach(mark => {

                const markValue =
                    Number(mark.marks);

                total += markValue;

                if (markValue > highest) {
                    highest = markValue;
                }


                const student =
                    students.find(
                        s => s.id === mark.studentId
                    );


                const studentName =
                    student
                        ? student.name
                        : "Student ID: " + mark.studentId;


                table.innerHTML += `

                    <tr>

                        <td>${mark.id}</td>

                        <td>${studentName}</td>

                        <td>${mark.subject}</td>

                        <td>
                            <span class="marks-badge">
                                ${mark.marks}
                            </span>
                        </td>

                        <td>

                            <button
                                class="edit"
                                onclick="editMarks(
                                    ${mark.id},
                                    ${mark.studentId},
                                    '${mark.subject}',
                                    ${mark.marks}
                                )">

                                Edit

                            </button>


                            <button
                                class="delete"
                                onclick="deleteMarks(${mark.id})">

                                Delete

                            </button>

                        </td>

                    </tr>

                `;

            });


            /* UPDATE STATS */

            document.getElementById("totalMarks").innerText =
                data.length;


            let average = 0;

            if (data.length > 0) {

                average = total / data.length;

            }

            document.getElementById("averageMarks").innerText =
                average.toFixed(2);


            document.getElementById("highestMarks").innerText =
                highest;

        })

        .catch(error => {

            console.log(error);

            alert("Error loading marks");

        });

}


/* VALIDATE MARKS */

function validateMarks() {

    const id =
        document.getElementById("id").value.trim();

    const studentId =
        document.getElementById("studentId").value;

    const subject =
        document.getElementById("subject").value.trim();

    const marksValue =
        document.getElementById("marks").value;


    if (!id) {

        alert("Please enter Marks ID");

        return false;

    }


    if (Number(id) <= 0) {

        alert("Marks ID must be greater than 0");

        return false;

    }


    if (!studentId) {

        alert("Please select a student");

        return false;

    }


    if (!subject) {

        alert("Please enter subject");

        return false;

    }


    if (subject.length < 2) {

        alert(
            "Subject must contain at least 2 characters"
        );

        return false;

    }


    if (marksValue === "") {

        alert("Please enter marks");

        return false;

    }


    const marks =
        Number(marksValue);


    if (isNaN(marks)) {

        alert("Marks must be a number");

        return false;

    }


    if (marks < 0 || marks > 100) {

        alert(
            "Marks must be between 0 and 100"
        );

        return false;

    }


    return true;

}


/* SAVE MARKS */

function saveMarks() {

    if (!validateMarks()) {
        return;
    }


    const marks = {

        id: Number(
            document.getElementById("id").value
        ),

        studentId: Number(
            document.getElementById("studentId").value
        ),

        subject:
            document.getElementById("subject").value.trim(),

        marks: Number(
            document.getElementById("marks").value
        )

    };


    fetch(apiUrl, {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(marks)

    })

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Failed to add marks"
            );

        }

        return response.json();

    })

    .then(data => {

        alert("Marks added successfully");

        clearForm();

        loadMarks();

    })

    .catch(error => {

        console.log(error);

        alert("Error adding marks");

    });

}


/* EDIT MARKS */

function editMarks(
    id,
    studentId,
    subject,
    marks
) {

    document.getElementById("id").value =
        id;

    document.getElementById("studentId").value =
        studentId;

    document.getElementById("subject").value =
        subject;

    document.getElementById("marks").value =
        marks;

}


/* UPDATE MARKS */

function updateMarks() {

    if (!validateMarks()) {
        return;
    }


    const marks = {

        id: Number(
            document.getElementById("id").value
        ),

        studentId: Number(
            document.getElementById("studentId").value
        ),

        subject:
            document.getElementById("subject").value.trim(),

        marks: Number(
            document.getElementById("marks").value
        )

    };


    fetch(apiUrl, {

        method: "PUT",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(marks)

    })

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Failed to update marks"
            );

        }

        return response.json();

    })

    .then(data => {

        alert("Marks updated successfully");

        clearForm();

        loadMarks();

    })

    .catch(error => {

        console.log(error);

        alert("Error updating marks");

    });

}


/* DELETE MARKS */

function deleteMarks(id) {

    if (
        !confirm(
            "Are you sure you want to delete these marks?"
        )
    ) {
        return;
    }


    fetch(apiUrl + "/" + id, {

        method: "DELETE"

    })

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Failed to delete marks"
            );

        }

        return response.text();

    })

    .then(data => {

        alert(data);

        loadMarks();

    })

    .catch(error => {

        console.log(error);

        alert("Error deleting marks");

    });

}


/* CLEAR FORM */

function clearForm() {

    document.getElementById("id").value = "";

    document.getElementById("studentId").value = "";

    document.getElementById("subject").value = "";

    document.getElementById("marks").value = "";

}


/* LOAD DATA */

loadStudents();

setTimeout(() => {

    loadMarks();

}, 500);

</script>

</body>

</html>
