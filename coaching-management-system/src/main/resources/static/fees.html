<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Fees Management</title>

<script>

    if (sessionStorage.getItem("isLoggedIn") !== "true") {

        window.location.href = "index.html";

    }

</script>


<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }


    body {
        background: #f4f7fb;
        color: #333;
    }


    /* HEADER */

    header {
        background: linear-gradient(
            135deg,
            #2563eb,
            #1e40af
        );

        color: white;

        padding: 18px 40px;

        display: flex;

        justify-content: space-between;

        align-items: center;

        box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    }


    .logo {
        font-size: 22px;
        font-weight: bold;
    }


    .back-btn {
        background: white;
        color: #2563eb;

        border: none;

        padding: 10px 20px;

        border-radius: 7px;

        cursor: pointer;

        font-size: 14px;

        font-weight: bold;
    }


    .back-btn:hover {
        background: #eef4ff;
    }


    /* CONTAINER */

    .container {
        width: 92%;
        max-width: 1200px;

        margin: 35px auto;
    }


    /* TITLE */

    .page-title {
        margin-bottom: 25px;
    }


    .page-title h1 {
        color: #1f2937;
        margin-bottom: 7px;
    }


    .page-title p {
        color: #6b7280;
    }


    /* STAT CARD */

    .stat-card {
        background: white;

        padding: 20px;

        border-radius: 12px;

        box-shadow:
            0 4px 15px rgba(0,0,0,0.07);

        width: 230px;

        margin-bottom: 25px;

        border-left: 5px solid #2563eb;
    }


    .stat-card h3 {
        color: #6b7280;

        font-size: 14px;

        margin-bottom: 8px;
    }


    .stat-card span {
        font-size: 30px;

        font-weight: bold;

        color: #2563eb;
    }


    /* FORM */

    .form-box {
        background: white;

        padding: 25px;

        border-radius: 12px;

        box-shadow:
            0 4px 15px rgba(0,0,0,0.07);

        margin-bottom: 25px;
    }


    .form-box h2 {
        color: #1f2937;

        margin-bottom: 20px;
    }


    .form-grid {
        display: grid;

        grid-template-columns:
            repeat(2, 1fr);

        gap: 16px;
    }


    .input-group {
        display: flex;

        flex-direction: column;

        gap: 6px;
    }


    .input-group label {
        font-size: 13px;

        font-weight: bold;

        color: #4b5563;
    }


    input,
    select {

        width: 100%;

        padding: 12px;

        border: 1px solid #d1d5db;

        border-radius: 7px;

        font-size: 14px;

        background: white;
    }


    input:focus,
    select:focus {

        outline: none;

        border-color: #2563eb;

        box-shadow:
            0 0 0 2px rgba(37,99,235,0.1);
    }


    /* BUTTONS */

    .button-group {

        margin-top: 20px;

        display: flex;

        gap: 10px;

        flex-wrap: wrap;
    }


    .add-btn {

        background: #198754;

        color: white;

        border: none;

        padding: 11px 25px;

        border-radius: 7px;

        cursor: pointer;

        font-weight: bold;
    }


    .add-btn:hover {
        background: #157347;
    }


    .update-btn {

        background: #f59e0b;

        color: white;

        border: none;

        padding: 11px 25px;

        border-radius: 7px;

        cursor: pointer;

        font-weight: bold;
    }


    .update-btn:hover {
        background: #d97706;
    }


    .clear-btn {

        background: #6b7280;

        color: white;

        border: none;

        padding: 11px 25px;

        border-radius: 7px;

        cursor: pointer;

        font-weight: bold;
    }


    .clear-btn:hover {
        background: #4b5563;
    }


    /* TABLE */

    .table-box {

        background: white;

        padding: 25px;

        border-radius: 12px;

        box-shadow:
            0 4px 15px rgba(0,0,0,0.07);

        overflow-x: auto;
    }


    .table-header {

        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 20px;
    }


    .table-header h2 {
        color: #1f2937;
    }


    .refresh-btn {

        background: #2563eb;

        color: white;

        border: none;

        padding: 9px 18px;

        border-radius: 7px;

        cursor: pointer;
    }


    .refresh-btn:hover {
        background: #1d4ed8;
    }


    table {

        width: 100%;

        border-collapse: collapse;

        min-width: 700px;
    }


    th {

        background: #1f2937;

        color: white;

        padding: 13px;

        text-align: left;
    }


    td {

        padding: 13px;

        border-bottom: 1px solid #e5e7eb;
    }


    tr:hover {
        background: #f8fafc;
    }


    /* STATUS */

    .status-paid {

        background: #dcfce7;

        color: #166534;

        padding: 5px 10px;

        border-radius: 20px;

        font-size: 12px;

        font-weight: bold;
    }


    .status-pending {

        background: #fef3c7;

        color: #92400e;

        padding: 5px 10px;

        border-radius: 20px;

        font-size: 12px;

        font-weight: bold;
    }


    /* ACTION BUTTONS */

    .edit-btn {

        background: #f59e0b;

        color: white;

        border: none;

        padding: 7px 12px;

        border-radius: 5px;

        cursor: pointer;

        margin-right: 5px;
    }


    .delete-btn {

        background: #dc3545;

        color: white;

        border: none;

        padding: 7px 12px;

        border-radius: 5px;

        cursor: pointer;
    }


    /* FOOTER */

    footer {

        text-align: center;

        color: #6b7280;

        padding: 25px;

        margin-top: 30px;

        font-size: 14px;
    }


    /* MOBILE */

    @media (max-width: 700px) {

        header {
            padding: 15px 20px;
        }


        .logo {
            font-size: 18px;
        }


        .container {
            width: 94%;
        }


        .form-grid {
            grid-template-columns: 1fr;
        }


        .button-group {
            flex-direction: column;
        }


        .button-group button {
            width: 100%;
        }


        .table-header {
            flex-direction: column;

            align-items: flex-start;

            gap: 10px;
        }

    }

</style>

</head>

<body>

```
<!-- HEADER -->

<header>

    <div class="logo">
        Coaching Management System
    </div>


    <button
        class="back-btn"
        onclick="goDashboard()">

        Dashboard

    </button>

</header>



<div class="container">


    <!-- PAGE TITLE -->

    <div class="page-title">

        <h1>
            Fees Management
        </h1>

        <p>
            Manage student fees and payment status
        </p>

    </div>



    <!-- TOTAL FEES -->

    <div class="stat-card">

        <h3>
            Total Fee Records
        </h3>

        <span id="feesCount">
            0
        </span>

    </div>



    <!-- FORM -->

    <div class="form-box">

        <h2>
            Add / Update Fees
        </h2>


        <div class="form-grid">


            <div class="input-group">

                <label>
                    Fees ID
                </label>

                <input
                    type="number"
                    id="id"
                    placeholder="Enter Fees ID">

            </div>



            <div class="input-group">

                <label>
                    Student
                </label>

                <select id="studentId">

                    <option value="">
                        Select Student
                    </option>

                </select>

            </div>



            <div class="input-group">

                <label>
                    Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter Amount"
                    min="1">

            </div>



            <div class="input-group">

                <label>
                    Payment Status
                </label>

                <select id="status">

                    <option value="">
                        Select Status
                    </option>

                    <option value="paid">
                        Paid
                    </option>

                    <option value="pending">
                        Pending
                    </option>

                </select>

            </div>

        </div>



        <div class="button-group">

            <button
                class="add-btn"
                onclick="addFees()">

                Add Fees

            </button>


            <button
                class="update-btn"
                onclick="updateFees()">

                Update Fees

            </button>


            <button
                class="clear-btn"
                onclick="clearForm()">

                Clear

            </button>

        </div>

    </div>



    <!-- TABLE -->

    <div class="table-box">


        <div class="table-header">

            <h2>
                All Fee Records
            </h2>


            <button
                class="refresh-btn"
                onclick="loadFees()">

                Refresh

            </button>

        </div>



        <table>

            <thead>

                <tr>

                    <th>
                        ID
                    </th>

                    <th>
                        Student
                    </th>

                    <th>
                        Amount
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Actions
                    </th>

                </tr>

            </thead>


            <tbody id="feesTable">

            </tbody>

        </table>

    </div>

</div>



<footer>

    Coaching Management System
    |
    Java Spring Boot + MySQL

</footer>



<script>


    const FEES_API = "/fees";

    const STUDENT_API = "/students";


    let students = [];



    // DASHBOARD

    function goDashboard() {

        window.location.href =
            "dashboard.html";

    }



    // LOAD STUDENTS

    function loadStudents() {

        fetch(STUDENT_API)

            .then(response => response.json())

            .then(data => {

                students = data;


                const dropdown =
                    document.getElementById(
                        "studentId"
                    );


                dropdown.innerHTML =
                    '<option value="">Select Student</option>';


                data.forEach(student => {

                    dropdown.innerHTML += `

                        <option value="${student.id}">

                            ${student.id} - ${student.name}

                        </option>

                    `;

                });

            })

            .catch(error => {

                console.error(error);

                alert(
                    "Unable to load students"
                );

            });

    }



    // LOAD FEES

    function loadFees() {

        fetch(FEES_API)

            .then(response => response.json())

            .then(data => {

                const table =
                    document.getElementById(
                        "feesTable"
                    );


                table.innerHTML = "";


                document.getElementById(
                    "feesCount"
                ).innerText = data.length;



                if (data.length === 0) {

                    table.innerHTML = `

                        <tr>

                            <td
                                colspan="5"
                                style="text-align:center;
                                color:#777;
                                padding:25px;">

                                No fee records found

                            </td>

                        </tr>

                    `;

                    return;

                }



                data.forEach(fees => {


                    const student =
                        students.find(
                            s =>
                                s.id ===
                                fees.studentId
                        );


                    const studentName =
                        student
                            ? student.name
                            : "Student ID: "
                              + fees.studentId;


                    const statusClass =
                        fees.status === "paid"
                            ? "status-paid"
                            : "status-pending";



                    table.innerHTML += `

                        <tr>

                            <td>
                                ${fees.id}
                            </td>


                            <td>
                                ${studentName}
                            </td>


                            <td>
                                ₹ ${Number(
                                    fees.amount
                                ).toFixed(2)}
                            </td>


                            <td>

                                <span
                                    class="${statusClass}">

                                    ${fees.status}

                                </span>

                            </td>


                            <td>

                                <button

                                    class="edit-btn"

                                    onclick="editFees(
                                        ${fees.id},
                                        ${fees.studentId},
                                        ${fees.amount},
                                        '${fees.status}'
                                    )">

                                    Edit

                                </button>


                                <button

                                    class="delete-btn"

                                    onclick="deleteFees(
                                        ${fees.id}
                                    )">

                                    Delete

                                </button>

                            </td>

                        </tr>

                    `;

                });

            })

            .catch(error => {

                console.error(error);

                alert(
                    "Unable to load fees"
                );

            });

    }



    // VALIDATE FEES

    function validateFees() {


        const id =
            document.getElementById("id")
                .value.trim();


        const studentId =
            document.getElementById("studentId")
                .value;


        const amount =
            document.getElementById("amount")
                .value.trim();


        const status =
            document.getElementById("status")
                .value;



        if (!id) {

            alert(
                "Please enter Fees ID"
            );

            return false;

        }


        if (Number(id) <= 0) {

            alert(
                "Fees ID must be greater than 0"
            );

            return false;

        }



        if (!studentId) {

            alert(
                "Please select a student"
            );

            return false;

        }



        if (!amount) {

            alert(
                "Please enter fees amount"
            );

            return false;

        }


        if (Number(amount) <= 0) {

            alert(
                "Fees amount must be greater than 0"
            );

            return false;

        }


        if (Number(amount) > 10000000) {

            alert(
                "Fees amount is too large"
            );

            return false;

        }



        if (!status) {

            alert(
                "Please select fees status"
            );

            return false;

        }


        if (
            status !== "paid" &&
            status !== "pending"
        ) {

            alert(
                "Invalid fees status"
            );

            return false;

        }


        return true;

    }



    // ADD FEES

    function addFees() {


        if (!validateFees()) {
            return;
        }


        const fees = {

            id: Number(
                document.getElementById("id")
                    .value
            ),

            studentId: Number(
                document.getElementById("studentId")
                    .value
            ),

            amount: Number(
                document.getElementById("amount")
                    .value
            ),

            status:
                document.getElementById("status")
                    .value

        };



        fetch(FEES_API, {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify(fees)

        })

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to add fees"
                );

            }

            return response.json();

        })

        .then(data => {

            alert(
                "Fees added successfully"
            );

            clearForm();

            loadFees();

        })

        .catch(error => {

            console.error(error);

            alert(
                "Failed to add fees"
            );

        });

    }



    // EDIT FEES

    function editFees(
        id,
        studentId,
        amount,
        status
    ) {


        document.getElementById("id")
            .value = id;


        document.getElementById("studentId")
            .value = studentId;


        document.getElementById("amount")
            .value = amount;


        document.getElementById("status")
            .value = status;


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }



    // UPDATE FEES

    function updateFees() {


        if (!validateFees()) {
            return;
        }


        const fees = {

            id: Number(
                document.getElementById("id")
                    .value
            ),

            studentId: Number(
                document.getElementById("studentId")
                    .value
            ),

            amount: Number(
                document.getElementById("amount")
                    .value
            ),

            status:
                document.getElementById("status")
                    .value

        };



        fetch(FEES_API, {

            method: "PUT",

            headers: {

                "Content-Type":
                    "application/json"

            },

            body:
                JSON.stringify(fees)

        })

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to update fees"
                );

            }

            return response.json();

        })

        .then(data => {

            alert(
                "Fees updated successfully"
            );

            clearForm();

            loadFees();

        })

        .catch(error => {

            console.error(error);

            alert(
                "Failed to update fees"
            );

        });

    }



    // DELETE FEES

    function deleteFees(id) {


        if (!confirm(
            "Are you sure you want to delete these fees?"
        )) {

            return;

        }



        fetch(
            FEES_API + "/" + id,
            {
                method: "DELETE"
            }
        )

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to delete fees"
                );

            }

            return response.text();

        })

        .then(data => {

            alert(data);

            loadFees();

        })

        .catch(error => {

            console.error(error);

            alert(
                "Failed to delete fees"
            );

        });

    }



    // CLEAR FORM

    function clearForm() {

        document.getElementById("id")
            .value = "";

        document.getElementById("studentId")
            .value = "";

        document.getElementById("amount")
            .value = "";

        document.getElementById("status")
            .value = "";

    }



    // FIRST LOAD STUDENTS THEN FEES

    loadStudents();

    setTimeout(() => {

        loadFees();

    }, 500);


</script>
